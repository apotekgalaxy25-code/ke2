name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Install dependensi
        run: |
          npm install
          mkdir -p www
          cp index.html www/index.html
      - name: Buat proyek Android
        run: npx cap add android
      - name: Atur target SDK 34
        run: |
          sed -i -E 's/targetSdkVersion *= *[0-9]+/targetSdkVersion = 34/' android/variables.gradle
          grep -n SdkVersion android/variables.gradle
      - name: Pasang ikon aplikasi
        run: |
          pip install pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          import os, shutil
          src = Image.open('icon.png').convert('RGBA')
          res = 'android/app/src/main/res'
          for d, s in {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}.items():
              im = src.resize((s, s), Image.LANCZOS)
              m = Image.new('L', (s, s), 0)
              ImageDraw.Draw(m).ellipse((0, 0, s - 1, s - 1), fill=255)
              r = Image.new('RGBA', (s, s), (0, 0, 0, 0))
              r.paste(im, (0, 0), m)
              os.makedirs(f'{res}/mipmap-{d}', exist_ok=True)
              im.save(f'{res}/mipmap-{d}/ic_launcher.png')
              r.save(f'{res}/mipmap-{d}/ic_launcher_round.png')
          shutil.rmtree(f'{res}/mipmap-anydpi-v26', ignore_errors=True)
          PY
      - name: Sinkronkan
        run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: keuangan-keluarga-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Rilis (jika ada tag v*)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
